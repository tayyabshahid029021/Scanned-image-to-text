version: '3.8'

services:
  aitransform-ocr-web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: aitransform-ocr-web
    restart: unless-stopped
    ports:
      - "8501:8501"
    environment:
      - ENVIRONMENT=production
      - APP_PORT=8501
    volumes:
      - ./data:/app/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8501/_stcore/health"]
      interval: 30s
      timeout: 5s
      retries: 3

  aitransform-ocr-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: aitransform-ocr-api
    restart: unless-stopped
    ports:
      - "8000:8000"
    command: ["uvicorn", "api:app", "--host", "0.0.0.0", "--port", "8000"]
    environment:
      - ENVIRONMENT=production
      - API_PORT=8000
    volumes:
      - ./data:/app/data
